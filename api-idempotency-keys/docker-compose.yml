services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'lab']
      interval: 1s
      retries: 60

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  provider:
    build: .
    command: ['node', 'src/provider.mjs']
    ports:
      - '8081:8081'

  api:
    build: .
    command: ['node', 'src/api.mjs']
    environment:
      DATABASE_URL: postgres://postgres:lab@db:5432/lab
      REDIS_URL: redis://redis:6379
      PROVIDER_URL: http://provider:8081
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      provider:
        condition: service_started
